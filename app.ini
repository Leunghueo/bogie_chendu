[sim]
enable = false
; enable = true

[plc]
# enable=false 时不加载该路、不启动轮询线程，程序其余部分照常运行
enable = true
path = runtime/hardware/plc.json

[vsp]
# enable=false 时不加载该路、不启动轮询线程，程序其余部分照常运行
enable = true
path = runtime/hardware/vsp.json
; poll_groups: 轮询分组数。点位按服务器分组并行采集, 同一台串口
; 服务器的点位串行, 减少对单台服务器的压力; 组间互不阻塞。
; 1 = 单线程顺序轮询(旧行为), 点数多/设备慢时可调大(如 4-6)。
poll_groups = 4

[can]
# enable=false 时不加载该路、不启动轮询线程，程序其余部分照常运行
enable = true
path = runtime/hardware/can.json

[node] 
path = runtime/workflow/nodes.json

[flow]
path = runtime/workflow/

[bogie]
path = runtime/device/bogies.json

[bed]
path = runtime/device/bed.json

[db]
path = runtime/db/bogie.db

[report]
template = runtime/pdf/abc.xlsx
path = runtime/pdf

[push]
path = runtime/push/config.json

[iot]
enable_iot = true

[theme]
style = light

[size]
w=1270
h=900
